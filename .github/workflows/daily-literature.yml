name: Daily literature

on:
  schedule:
    # Beijing time: 08:17, with catch-up checks at 12:37 and 20:47.
    # GitHub may delay/drop scheduled jobs; each later trigger checks main again.
    - cron: "17 0 * * *"
    - cron: "37 4 * * *"
    - cron: "47 12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily-literature.yml"
      - "scripts/update_literature.py"
      - "scripts/literature_config.json"
      - "scripts/literature_terms.json"

permissions:
  contents: write

concurrency:
  group: daily-literature
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Decide whether a search is needed
        id: plan
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          from scripts.update_literature import scheduled_run_needed

          config = json.loads(Path('scripts/literature_config.json').read_text())
          data = json.loads(Path('src/data/daily-literature.json').read_text())
          needed = os.environ['TRIGGER_EVENT'] != 'schedule' or scheduled_run_needed(config, data, datetime.now(timezone.utc))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('needed=' + str(needed).lower(), file=output)
          if not needed:
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  print('Today’s Beijing-time search already succeeded and the daily article limit is reached. No duplicate search or deployment needed.', file=summary)
          PY
      - uses: actions/setup-python@v5
        if: steps.plan.outputs.needed == 'true'
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        if: steps.plan.outputs.needed == 'true'
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
        if: steps.plan.outputs.needed == 'true'
      - name: Test importer
        if: steps.plan.outputs.needed == 'true'
        run: python3 -m unittest discover -s tests/literature -v
      - name: Search and import licensed abstracts
        if: steps.plan.outputs.needed == 'true'
        run: |
          # The importer publishes atomically. Retry temporary source/network
          # failures without replacing the last successful catalog.
          for attempt in 1 2 3; do
            if python3 scripts/update_literature.py; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 5
          done
      - name: Validate content and build
        if: steps.plan.outputs.needed == 'true'
        run: |
          python3 scripts/update_literature.py --check
          npm test
          npm run build
      - name: Commit content update
        if: steps.plan.outputs.needed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/daily-literature.json
          if git diff --cached --quiet; then exit 0; fi
          # Preserve the established app maintainer as author for Vercel Hobby's
          # author membership check; the automation remains the visible committer.
          export GIT_AUTHOR_NAME="$(git log -1 --format=%an -- src/components/ReadingLab.tsx)"
          export GIT_AUTHOR_EMAIL="$(git log -1 --format=%ae -- src/components/ReadingLab.tsx)"
          git commit -m 'Update daily literature and vocabulary'
          # Retry when app changes land during ingestion; never overwrite main.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            git fetch origin main
            git rebase origin/main
          done
      - name: Publish run summary
        if: success() && steps.plan.outputs.needed == 'true'
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          data = json.loads(Path('src/data/daily-literature.json').read_text())
          print('## Daily literature')
          print('Last successful check:', data['lastCheckedAt'])
          print('Articles added this run:', data['history'][0]['added'])
          print('Total articles:', len(data['articles']))
          print('New vocabulary total:', len(data['vocabulary']))
          print('Vocabulary added this run:', data['history'][0].get('vocabularyAdded', 0))
          print('Screening counts:', json.dumps(data['history'][0].get('screening', {}), sort_keys=True))
          print('\nThe existing Vercel Git integration receives the content commit. Check its deployment status separately.')
          PY
