name: Daily literature

on:
  schedule:
    # 08:17 Asia/Shanghai. GitHub may delay scheduled jobs.
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily-literature.yml"
      - "scripts/update_literature.py"
      - "scripts/literature_config.json"
      - "scripts/literature_terms.json"

permissions:
  contents: write

concurrency:
  group: daily-literature
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Test importer
        run: python3 -m unittest discover -s tests/literature -v
      - name: Search and import licensed abstracts
        run: python3 scripts/update_literature.py
      - name: Validate content and build
        run: |
          python3 scripts/update_literature.py --check
          npm test
          npm run build
      - name: Commit content update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/daily-literature.json
          if git diff --cached --quiet; then exit 0; fi
          # Preserve the established app maintainer as author for Vercel Hobby's
          # author membership check; the automation remains the visible committer.
          export GIT_AUTHOR_NAME="$(git log -1 --format=%an -- src/components/ReadingLab.tsx)"
          export GIT_AUTHOR_EMAIL="$(git log -1 --format=%ae -- src/components/ReadingLab.tsx)"
          git commit -m 'Update daily literature and vocabulary'
          # A concurrent main change causes a safe failure rather than overwriting it.
          git push origin HEAD:main
      - name: Publish run summary
        if: success()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          data = json.loads(Path('src/data/daily-literature.json').read_text())
          print('## Daily literature')
          print('Last successful check:', data['lastCheckedAt'])
          print('Articles added this run:', data['history'][0]['added'])
          print('Total articles:', len(data['articles']))
          print('New vocabulary total:', len(data['vocabulary']))
          print('\nThe existing Vercel Git integration receives the content commit. Check its deployment status separately.')
          PY
